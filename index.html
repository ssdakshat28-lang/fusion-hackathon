<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>RESQNET - Emergency Response (Demo)</title>

  <!-- External Libraries via CDN -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

      scroll-padding-top: env(safe-area-inset-top, 0px);

      background: #0b1220;
      color: #e2e8f0;

</head>
<body>
  <div id="root">
    <p style="padding: 16px; color: #94a3b8;">Loading RESQNET…</p>
  </div>

  <script>
  (() => {
    const React = window.React;
    const { useState, useEffect, useReducer, createContext, useContext, Component } = React;

    // --- Icon Helpers ---
    const createIcon = (char) => ({ className = "" }) =>
      React.createElement("span", { className }, char);

    const Icons = {
      Dashboard: createIcon("\u25A6"),    // ◾
      Map: createIcon("\u25C9"),          // ◉
      Vehicle: createIcon("\u{1F691}"),   // 🚑
      Hospital: createIcon("\u{1F3E5}"),  // 🏥
      Incident: createIcon("\u{1F6A8}"),  // 🚨
      Report: createIcon("\u271A"),        // ✚
      Play: createIcon("\u25B6"),          // ▶
      Pause: createIcon("\u23F8"),         // ⏸
      Reset: createIcon("\u21BA"),         // ↺
      Lightning: createIcon("\u26A1"),     // ⚡
    };

    // --- Coordinates & Geography (Pune, India) ---
    const PUNE_AREAS = {
      Swargate: [18.5018, 73.8636],
      Shivajinagar: [18.5308, 73.8475],
      Hadapsar: [18.5089, 73.926],
      Kothrud: [18.5074, 73.8077],
      "Viman Nagar": [18.5679, 73.9143],
      Hinjewadi: [18.5912, 73.7389],
      Katraj: [18.4575, 73.8677],
      Pimpri: [18.6279, 73.8009],
      Baner: [18.559, 73.7868],
      Camp: [18.5136, 73.8786],
    };

    const getPastTime = (minutesAgo) => Date.now() - minutesAgo * 60000;

    const INCIDENT_TYPES = [
      "Fire",
      "Medical",
      "Road Accident",
      "Flooding",
      "Building Collapse",
      "Fallen Tree",
      "Law & Order",
      "Road Blockage",
      "Other"
    ];

    const INCIDENT_STATUSES = [
      "Reported",
      "Under Verification",
      "Verified",
      "Response Dispatched",
      "Resolved"
    ];

    const SEVERITY_LEVELS = ["Low", "Medium", "High", "Critical"];

    const createIncident = (id, type, area, sev, status, verified, minutesAgo, desc = "") => ({
      id,
      type,
      area,
      loc: PUNE_AREAS[area],
      sev,
      status,
      verified,
      vehicle: null,
      desc,
      time: getPastTime(minutesAgo),
      timeline: [{ t: getPastTime(minutesAgo), msg: "Report received (simulated)" }],
    });

    // --- Initial Dataset Factory ---
    function getInitialData() {
      const createVehicle = (id, type, area, status = "Available", incident = null) => ({
        id,
        type,
        area,
        loc: PUNE_AREAS[area],
        status,
        incident,
        updated: getPastTime(Math.random() * 20 + 1),
      });

      const vehicles = [
        createVehicle("AMB-001", "Ambulance", "Shivajinagar"),
        createVehicle("AMB-002", "Ambulance", "Swargate"),
        createVehicle("AMB-003", "Ambulance", "Hadapsar"),
        createVehicle("AMB-004", "Ambulance", "Kothrud", "Busy"),
        createVehicle("AMB-005", "Ambulance", "Baner", "Dispatched", "INC-1003"),
        createVehicle("POL-001", "Police", "Camp"),
        createVehicle("POL-002", "Police", "Swargate"),
        createVehicle("POL-003", "Police", "Viman Nagar", "Busy"),
        createVehicle("POL-004", "Police", "Pimpri"),
        createVehicle("FIRE-001", "Fire", "Shivajinagar"),
        createVehicle("FIRE-002", "Fire", "Hadapsar"),
        createVehicle("FIRE-003", "Fire", "Katraj", "Dispatched", "INC-1001"),
      ];

      const createHospital = (id, name, area, lat, lng, genTotal, genOcc, icuTotal, icuOcc, ed) => ({
        id,
        name,
        area,
        loc: [lat, lng],
        gen: [genTotal, genOcc],
        icu: [icuTotal, icuOcc],
        ed,
        updated: getPastTime(Math.random() * 30 + 2),
      });

      const hospitals = [
        createHospital("H1", "Sassoon General Hospital", "Pune Station", 18.5286, 73.8744, 300, 262, 30, 26, "Open"),
        createHospital("H2", "Ruby Hall Clinic", "Sassoon Road", 18.5314, 73.8774, 200, 168, 24, 20, "Open"),
        createHospital("H3", "Jehangir Hospital", "Sassoon Road", 18.5303, 73.8759, 150, 141, 14, 14, "Full"),
        createHospital("H4", "Deenanath Mangeshkar Hospital", "Erandwane", 18.5069, 73.8296, 220, 160, 26, 17, "Open"),
        createHospital("H5", "KEM Hospital Pune", "Rasta Peth", 18.519, 73.87, 180, 150, 16, 13, "Open"),
        createHospital("H6", "Sahyadri Hospital Deccan", "Deccan", 18.516, 73.841, 130, 98, 14, 9, "Open"),
        createHospital("H7", "Noble Hospital", "Hadapsar", 18.513, 73.929, 110, 80, 12, 7, "Open"),
        createHospital("H8", "Poona Hospital", "Sadashiv Peth", 18.509, 73.847, 100, 88, 10, 9, "Diverting"),
        createHospital("H9", "Bharati Hospital", "Dhankawadi", 18.459, 73.859, 160, 120, 18, 11, "Open"),
        createHospital("H10", "Jupiter Hospital", "Baner", 18.558, 73.78, 120, 84, 14, 8, "Open"),
        createHospital("H11", "Columbia Asia Hospital", "Kharadi", 18.552, 73.94, 90, 66, 10, 6, "Open"),
        createHospital("H12", "Aditya Birla Memorial Hospital", "Chinchwad", 18.614, 73.784, 170, 158, 16, 15, "Diverting"),
      ];

      const incidents = [
        createIncident("INC-1001", "Fire", "Katraj", "High", "Response Dispatched", true, 25, "Warehouse fire"),
        createIncident("INC-1002", "Road Accident", "Hinjewadi", "Critical", "Verified", true, 12, "Multi-vehicle collision"),
        createIncident("INC-1003", "Medical", "Baner", "High", "Response Dispatched", true, 18, "Cardiac emergency"),
        createIncident("INC-1004", "Flooding", "Kothrud", "Medium", "Verified", true, 90),
        createIncident("INC-1005", "Fallen Tree", "Camp", "Low", "Reported", false, 8),
        createIncident("INC-1006", "Law & Order", "Pimpri", "Medium", "Under Verification", false, 15),
        createIncident("INC-1007", "Building Collapse", "Hadapsar", "Critical", "Verified", true, 40),
        createIncident("INC-1008", "Road Blockage", "Swargate", "Medium", "Reported", false, 5),
        createIncident("INC-1009", "Fire", "Viman Nagar", "Low", "Resolved", true, 200),
        createIncident("INC-1010", "Medical", "Shivajinagar", "Medium", "Resolved", true, 260),
      ];

      incidents[0].vehicle = "FIRE-003";
      incidents[2].vehicle = "AMB-005";

      const createBlockage = (id, road, area, reason, sev, path, reopen) => ({
        id,
        road,
        area,
        loc: PUNE_AREAS[area],
        reason,
        sev,
        path,
        reopen,
        active: true,
        time: getPastTime(Math.random() * 120 + 5),
      });

      const blocks = [
        createBlockage("RB-1", "Pune-Satara Rd", "Swargate", "Waterlogging", "High", [[18.503, 73.862], [18.498, 73.866]], "~2 h"),
        createBlockage("RB-2", "Karve Rd", "Kothrud", "Tree fall", "Medium", [[18.5, 73.82], [18.504, 73.81]], "~45 min"),
        createBlockage("RB-3", "Solapur Rd", "Hadapsar", "Collapse debris", "Critical", [[18.51, 73.92], [18.507, 73.93]], "Unknown"),
        createBlockage("RB-4", "FC Road", "Shivajinagar", "Accident", "Medium", [[18.528, 73.84], [18.533, 73.85]], "~30 min"),
        createBlockage("RB-5", "Mumbai-Bengaluru Hwy", "Baner", "Road work", "Low", [[18.56, 73.78], [18.558, 73.795]], "~4 h"),
        createBlockage("RB-6", "Nagar Rd", "Viman Nagar", "Flooding", "High", [[18.566, 73.91], [18.57, 73.918]], "~1 h"),
        createBlockage("RB-7", "Katraj Ghat", "Katraj", "Landslide debris", "High", [[18.46, 73.865], [18.455, 73.87]], "Unknown"),
        createBlockage("RB-8", "Hinjewadi Phase 1", "Hinjewadi", "Accident", "High", [[18.59, 73.735], [18.593, 73.742]], "~1 h"),
      ];

      return {
        vehicles,
        hospitals,
        incidents,
        blocks,
        role: "Emergency Administrator",
        sim: false,
        toast: null,
        sel: "INC-1002",
        updated: Date.now(),
      };
    }

    const STATIONS = [
      ["Police", "Shivajinagar Police Station", [18.532, 73.847]],
      ["Police", "Swargate Police Station", [18.501, 73.863]],
      ["Police", "Deccan Gymkhana Police Station", [18.517, 73.842]],
      ["Police", "Hadapsar Police Station", [18.5, 73.926]],
      ["Police", "Kothrud Police Station", [18.505, 73.81]],
      ["Fire", "Pune Fire Brigade - Shivajinagar", [18.529, 73.85]],
      ["Fire", "Pune Fire Brigade - Kasba Peth", [18.516, 73.856]],
      ["Fire", "Fire Station - Hadapsar", [18.507, 73.923]],
      ["Fire", "Fire Station - Kothrud", [18.509, 73.817]],
      ["Fire", "PCMC Fire Station - Pimpri", [18.626, 73.8]],
    ];

    const EMERGENCY_NUMBERS = [
      ["National emergency", "112"],
      ["Police", "100"],
      ["Fire", "101"],
      ["Ambulance (Maharashtra EMS)", "108"],
    ];

    // --- Distance & Beds Utility ---
    const calcDistance = (coord1, coord2) => {
      const toRad = (deg) => (deg * Math.PI) / 180;
      const dLat = toRad(coord2[0] - coord1[0]);
      const dLng = toRad(coord2[1] - coord1[1]);
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(coord1[0])) * Math.cos(toRad(coord2[0])) * Math.sin(dLng / 2) ** 2;
      return 12742 * Math.asin(Math.sqrt(a));
    };

    const availableBeds = ([total, occupied]) => total - occupied;

    const addTimelineEvent = (incident, msg) => ({
      ...incident,
      timeline: [...incident.timeline, { t: Date.now(), msg: `${msg} (simulated)` }],
    });

    const withTimestamp = (state, patch) => ({
      ...state,
      ...patch,
      updated: Date.now(),
    });

    // --- State Reducer ---
    function appReducer(state, action) {
      switch (action.type) {
        case "reset":
          return { ...getInitialData(), role: state.role };
        case "role":
          return { ...state, role: action.v };
        case "sim":
          return { ...state, sim: !state.sim };
        case "toast":
          return { ...state, toast: action.v };
        case "select":
          return { ...state, sel: action.v };
        case "addIncident":
          return withTimestamp(state, {
            incidents: [action.v, ...state.incidents],
            sel: action.v.id,
            toast: `${action.v.id} added${action.v.verified ? "" : " (unverified)"} - demo only`,
          });
        case "inc":
          return withTimestamp(state, {
            incidents: state.incidents.map((i) =>
              i.id === action.id ? addTimelineEvent({ ...i, ...action.patch }, action.msg) : i
            ),
          });
        case "assign": {
          const inc = state.incidents.find((i) => i.id === action.inc);
          return withTimestamp(state, {
            vehicles: state.vehicles.map((v) =>
              v.id === inc.vehicle && v.id !== action.veh
                ? { ...v, status: "Available", incident: null }
                : v.id === action.veh
                ? { ...v, status: "Dispatched", incident: action.inc, updated: Date.now() }
                : v
            ),
            incidents: state.incidents.map((i) =>
              i.id === action.inc
                ? addTimelineEvent(
                    { ...i, vehicle: action.veh, status: "Response Dispatched", verified: true },
                    `${action.veh} assigned (demo, no real dispatch)`
                  )
                : i
            ),
            toast: `${action.veh} assigned to ${action.inc} (simulated)`,
          });
        }
        case "vstatus": {
          return withTimestamp(state, {
            vehicles: state.vehicles.map((v) =>
              v.id === action.id
                ? {
                    ...v,
                    status: action.v,
                    incident: action.v === "Dispatched" ? v.incident : null,
                    updated: Date.now(),
                  }
                : v
            ),
            incidents: state.incidents.map((i) =>
              i.vehicle === action.id && action.v !== "Dispatched"
                ? addTimelineEvent({ ...i, vehicle: null }, `${action.id} marked ${action.v}`)
                : i
            ),
            toast: `${action.id} set to ${action.v} (simulated)`,
          });
        }
        case "bed":
          return withTimestamp(state, {
            hospitals: state.hospitals.map((h) =>
              h.id === action.id
                ? {
                    ...h,
                    [action.kind]: [
                      h[action.kind][0],
                      Math.max(0, Math.min(h[action.kind][0], h[action.kind][1] + action.delta)),
                    ],
                    updated: Date.now(),
                  }
                : h
            ),
          });
        case "addVehicle":
          return withTimestamp(state, {
            vehicles: [...state.vehicles, action.v],
            toast: `${action.v.id} added`,
          });
        case "editVehicle":
          return withTimestamp(state, {
            vehicles: state.vehicles.map((v) =>
              v.id === action.id ? { ...v, ...action.patch, updated: Date.now() } : v
            ),
          });
        case "tick": {
          const [r1, r2, r3] = action.r;
          if (r1 < 0.4) {
            const idleVehicles = state.vehicles.filter((v) => v.status !== "Dispatched");
            if (!idleVehicles.length) return state;
            const chosen = idleVehicles[Math.floor(r2 * idleVehicles.length)];
            return withTimestamp(state, {
              vehicles: state.vehicles.map((v) =>
                v.id === chosen.id
                  ? {
                      ...v,
                      status: chosen.status === "Available" ? "Busy" : "Available",
                      updated: Date.now(),
                    }
                  : v
              ),
            });
          }
          if (r1 < 0.8) {
            const hospital = state.hospitals[Math.floor(r2 * state.hospitals.length)];
            const delta = r3 < 0.5 ? -1 : 1;
            return withTimestamp(state, {
              hospitals: state.hospitals.map((h) =>
                h.id === hospital.id
                  ? {
                      ...h,
                      gen: [h.gen[0], Math.max(0, Math.min(h.gen[0], h.gen[1] + delta * 2))],
                      icu: r3 > 0.8 ? [h.icu[0], Math.max(0, Math.min(h.icu[0], h.icu[1] + delta))] : h.icu,
                      updated: Date.now(),
                    }
                  : h
              ),
            });
          }
          if (r1 < 0.9) {
            const areaKeys = Object.keys(PUNE_AREAS);
            const demoTypes = ["Fallen Tree", "Road Blockage", "Flooding", "Medical"];
            const newInc = createIncident(
              "INC-" + (Date.now() % 100000),
              demoTypes[Math.floor(r3 * demoTypes.length)],
              areaKeys[Math.floor(r2 * areaKeys.length)],
              "Medium",
              "Reported",
              false,
              0,
              "Simulated citizen report"
            );
            return withTimestamp(state, {
              incidents: [newInc, ...state.incidents],
              toast: `New simulated report ${newInc.id}`,
            });
          }
          const chosenBlock = state.blocks[Math.floor(r2 * state.blocks.length)];
          return withTimestamp(state, {
            blocks: state.blocks.map((b) =>
              b.id === chosenBlock.id ? { ...b, active: !b.active, time: Date.now() } : b
            ),
          });
        }
        default:
          return state;
      }
    }

    const AppContext = createContext();

    function AppProvider({ children }) {
      const [state, dispatch] = useReducer(appReducer, null, () => {
        try {
          return { ...getInitialData(), ...JSON.parse(localStorage.getItem("resqnet")) };
        } catch {
          return getInitialData();
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem("resqnet", JSON.stringify({ ...state, toast: null }));
        } catch {}
      }, [state]);

      useEffect(() => {
        if (!state.sim) return;
        const timer = setInterval(() => {
          dispatch({ type: "tick", r: [Math.random(), Math.random(), Math.random()] });
        }, 4000);
        return () => clearInterval(timer);
      }, [state.sim]);

      return React.createElement(AppContext.Provider, { value: [state, dispatch] }, children);
    }

    const useApp = () => useContext(AppContext);

    // --- Recommendation Logic ---
    const getResponderType = (incident) =>
      incident.type === "Fire" ? "Fire" : incident.type === "Law & Order" ? "Police" : "Ambulance";

    const needsHospital = (incident) =>
      ["Medical", "Road Accident", "Building Collapse", "Fire"].includes(incident.type);

    function recommendResources(state, incident) {
      const respType = getResponderType(incident);
      const vehicles = state.vehicles
        .filter((v) => v.type === respType && v.status === "Available")
        .map((v) => ({ ...v, d: calcDistance(v.loc, incident.loc) }))
        .sort((a, b) => a.d - b.d);

      const police =
        incident.type === "Road Accident"
          ? state.vehicles
              .filter((v) => v.type === "Police" && v.status === "Available")
              .map((v) => ({ ...v, d: calcDistance(v.loc, incident.loc) }))
              .sort((a, b) => a.d - b.d)
          : [];

      const hospitals = needsHospital(incident)
        ? state.hospitals
            .filter(
              (h) =>
                h.ed !== "Full" &&
                availableBeds(h.gen) > 0 &&
                (incident.sev !== "Critical" && incident.sev !== "High" || availableBeds(h.icu) > 0)
            )
            .map((h) => ({ ...h, d: calcDistance(h.loc, incident.loc) }))
            .sort((a, b) => a.d - b.d)
        : [];

      const blocks = state.blocks
        .filter((b) => b.active && calcDistance(b.loc, incident.loc) < 4)
        .map((b) => ({ ...b, d: calcDistance(b.loc, incident.loc) }))
        .sort((a, b) => a.d - b.d);

      return { type: respType, vehicles, police, hospitals, blocks };
    }

    // --- Common UI Components ---
    class ErrorBoundary extends Component {
      state = { e: null };
      static getDerivedStateFromError(e) {
        return { e };
      }
      render() {
        return this.state.e
          ? React.createElement(
              "div",
              { className: "p-4 rounded-xl border border-red-600 text-red-300 text-sm" },
              "This page hit an error: ",
              String(this.state.e.message)
            )
          : this.props.children;
      }
    }

    const formatRelativeTime = (timestamp) => {
      const mins = Math.round((Date.now() - timestamp) / 60000);
      if (mins < 1) return "just now";
      if (mins < 60) return `${mins} min ago`;
      return `${Math.round(mins / 60)} h ago`;
    };

    const Card = ({ title, children, className = "" }) =>
      React.createElement(
        "section",
        { className: `rounded-xl bg-slate-800/60 border border-slate-700 p-4 shadow-lg ${className}` },
        title && React.createElement("h3", { className: "text-sm font-semibold text-slate-300 mb-3" }, title),
        children
      );

    const BADGE_COLORS = {
      Critical: "bg-red-500/20 text-red-300",
      High: "bg-orange-500/20 text-orange-300",
      Medium: "bg-yellow-500/20 text-yellow-200",
      Available: "bg-green-500/20 text-green-300",
      Open: "bg-green-500/20 text-green-300",
      Resolved: "bg-green-500/20 text-green-300",
      Dispatched: "bg-orange-500/20 text-orange-300",
      Diverting: "bg-orange-500/20 text-orange-300",
      Busy: "bg-red-500/20 text-red-300",
      Full: "bg-red-500/20 text-red-300",
      Unverified: "bg-yellow-500/20 text-yellow-200",
    };

    const Badge = ({ v }) =>
      React.createElement(
        "span",
        { className: `px-2 py-0.5 rounded-full text-xs whitespace-nowrap ${BADGE_COLORS[v] || "bg-slate-600/40 text-slate-300"}` },
        v
      );

    const inputClasses = "bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-slate-100 w-full";
    const primaryButtonClasses = "px-3 py-2 rounded-lg text-sm font-medium bg-red-600 hover:bg-red-500 text-white disabled:opacity-40 transition";
    const secondaryButtonClasses = "px-3 py-2 rounded-lg text-sm font-medium bg-slate-700 hover:bg-slate-600 text-white transition";

    const Recharts = window.Recharts || {};
    const NullComp = () => null;
    const PieChart = Recharts.PieChart || NullComp;
    const Pie = Recharts.Pie || NullComp;
    const Cell = Recharts.Cell || NullComp;
    const Tooltip = Recharts.Tooltip || NullComp;
    const ResponsiveContainer = Recharts.ResponsiveContainer || NullComp;
    const BarChart = Recharts.BarChart || NullComp;
    const Bar = Recharts.Bar || NullComp;
    const XAxis = Recharts.XAxis || NullComp;
    const YAxis = Recharts.YAxis || NullComp;

    // --- Tab 1: Command Center ---
    function DashboardView() {
      const [state] = useApp();
      const vehicles = state.vehicles;

      const countVehicles = (type, status) =>
        vehicles.filter((v) => v.type === type && (!status || v.status === status)).length;

      const activeIncidents = state.incidents.filter((i) => i.status !== "Resolved");

      const stats = [
        ["Vehicles", vehicles.length],
        ["Ambulances free", countVehicles("Ambulance", "Available"), "g"],
        ["Ambulances busy", vehicles.filter((v) => v.type === "Ambulance" && v.status !== "Available").length, "o"],
        ["Police free", countVehicles("Police", "Available"), "g"],
        ["Fire trucks free", countVehicles("Fire", "Available"), "g"],
        ["Hospitals", state.hospitals.length],
        ["General beds free", state.hospitals.reduce((acc, h) => acc + availableBeds(h.gen), 0), "g"],
        ["ICU beds free", state.hospitals.reduce((acc, h) => acc + availableBeds(h.icu), 0), "g"],
        ["Road blockages", state.blocks.filter((b) => b.active).length, "o"],
        ["Active incidents", activeIncidents.length, "r"],
      ];

      const colorMap = { g: "text-green-400", o: "text-orange-400", r: "text-red-400" };

      const pieData = ["Critical", "High", "Medium", "Low"].map((level, idx) => ({
        name: level,
        value: activeIncidents.filter((i) => i.sev === level).length,
        fill: ["#ef4444", "#f97316", "#eab308", "#64748b"][idx],
